# meow-text localization resources (English)
#
# build.rs reads this file at compile time:
#   - {{key}} placeholders in ui/index.html are replaced using the build default locale
#   - ui/locale.js (generated) ships *every* locale to the frontend for runtime switching
#   - src/i18n.rs (generated) turns each entry into a Rust constant (also runtime-switchable)
# Adding a language = dropping another xx-YY.toml into locales/ (keys must match exactly).

# Locale metadata: `name` is the endonym, shown as-is in every language
