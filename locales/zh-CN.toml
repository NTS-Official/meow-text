# meow-text 本地化资源（简体中文）
#
# 这个文件在编译时被 build.rs 读取：
#   - ui/index.html 里的 {{key}} 会被替换成这里的文本
#   - ui/locale.js（自动生成）把整张表交给前端 JS 用
#   - src/i18n.rs（自动生成）把每条文案变成 Rust 常量
# 因此改完文案需要重新编译才会生效。加语言 = 在 locales/ 下放一份同名的 xx-YY.toml。

# 语言包自己的元信息：name 是这门语言的自称，任何语言下都显示这个
